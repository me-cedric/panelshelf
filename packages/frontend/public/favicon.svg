<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Shelf back -->
  <rect x="4" y="20" width="24" height="3" rx="1" fill="#374151" />
  <!-- Shelf shadow -->
  <rect x="4" y="23" width="24" height="1" rx="0.5" fill="#1f2937" />
  <!-- Book 1 - thick, indigo -->
  <rect x="6" y="8" width="6" height="13" rx="1" fill="url(#g1)" />
  <rect x="6" y="8" width="6" height="2" rx="1" fill="rgba(255,255,255,0.15)" />
  <!-- Book 1 spine line -->
  <line x1="9" y1="11" x2="9" y2="19" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" />
  <!-- Book 2 - thinner, purple -->
  <rect x="13" y="11" width="4" height="10" rx="0.8" fill="url(#g2)" />
  <!-- Book 2 spine -->
  <line x1="15" y1="14" x2="15" y2="19" stroke="rgba(255,255,255,0.25)" stroke-width="0.5" />
  <!-- Book 3 - medium, blue-gray -->
  <rect x="18" y="6" width="5" height="15" rx="0.8" fill="#6366f1" />
  <rect x="18" y="6" width="5" height="2" rx="0.8" fill="rgba(255,255,255,0.12)" />
  <!-- Book 3 spine -->
  <line x1="20.5" y1="9" x2="20.5" y2="19" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />
  <!-- Book 4 - thin, violet -->
  <rect x="24" y="13" width="3" height="8" rx="0.6" fill="#8b5cf6" />
  <!-- Left side panel -->
  <rect x="3" y="5" width="1" height="18" rx="0.3" fill="#4b5563" />
  <!-- Right side panel -->
  <rect x="28" y="5" width="1" height="18" rx="0.3" fill="#4b5563" />
</svg>
